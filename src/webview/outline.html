<meta name="viewport" content="width=device-width, initial-scale=1.0">
<div class="outline-container" id="outline-container" dir="auto">
  <div class="nav-header" role="toolbar" aria-label="Outline controls">
    <div class="nav-buttons-container">
      <button type="button" class="clickable-icon nav-action-button" id="search-toggle-btn" aria-label="Filter headings" aria-pressed="false" aria-controls="search-container" title="Filter headings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <button type="button" class="clickable-icon nav-action-button" id="wrap-toggle-btn" aria-label="Toggle text wrap" aria-pressed="false" title="Toggle text wrap">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="15" y2="12"></line>
          <polyline points="16 10 19 12 16 14"></polyline>
          <path d="M19 12h-4a3 3 0 0 0-3 3v1"></path>
          <line x1="3" y1="18" x2="10" y2="18"></line>
        </svg>
      </button>
      <button type="button" class="clickable-icon nav-action-button" id="collapse-all-btn" aria-label="Collapse all sections" aria-pressed="false" title="Collapse all sections">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="4 14 10 14 10 20"></polyline>
          <polyline points="20 10 14 10 14 4"></polyline>
          <line x1="14" y1="10" x2="21" y2="3"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </button>
      <button type="button" class="clickable-icon nav-action-button" id="insert-toc-btn" aria-label="Insert Markdown Table of Contents" title="Insert Markdown Table of Contents">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="search-input-container" id="search-container">
      <input type="search" id="search-input" placeholder="Filter headings..." aria-label="Filter headings" autocomplete="off">
      <button type="button" class="search-clear-btn" id="search-clear-btn" aria-label="Clear filter" title="Clear filter">&times;</button>
    </div>
  </div>
  <div class="outline-tree" id="outline-tree" role="tree" aria-label="Note outline">
    <div class="outline-status" role="status" aria-live="polite">Select a note to view outline</div>
  </div>
  <div class="outline-context-menu" id="outline-context-menu" role="menu" aria-label="Heading actions" hidden>
    <button type="button" class="context-menu-item" role="menuitem" data-action="copy-markdown">Copy Joplin Markdown link</button>
    <button type="button" class="context-menu-item" role="menuitem" data-action="copy-slug">Copy anchor slug (#slug)</button>
    <div class="context-menu-separator" role="separator"></div>
    <button type="button" class="context-menu-item" role="menuitem" data-action="insert-toc">Insert Markdown TOC into note</button>
  </div>
  <div class="outline-toast" id="outline-toast" role="status" aria-live="polite" hidden></div>
</div>
