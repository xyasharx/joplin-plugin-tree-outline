name: Build & Release JPL

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (Node 26 Current)
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm install

      - name: Build Joplin plugin (.jpl)
        run: npm run dist

      - name: Upload .jpl to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: publish/*.jpl
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
