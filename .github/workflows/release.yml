name: Build & Release JPL

on:
  push:
    tags:
      - 'v*' # ONLY runs automatically when you push a tag (e.g. v1.0.0, v1.0.1)
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub whenever you want
    inputs:
      custom_tag:
        description: 'Tag name (leave empty to use version from package.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (Node 26 Current)
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm install

      - name: Build Joplin plugin (.jpl)
        run: npm run dist

      - name: Determine Tag Name
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAG="${{ github.event.inputs.custom_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG"

      - name: Upload .jpl Artifact
        uses: actions/upload-artifact@v7
        with:
          name: joplin-plugin
          path: publish/*.jpl

      - name: Upload .jpl to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          files: publish/*.jpl
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
