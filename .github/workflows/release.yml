name: Build & Release JPL (Testing)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows clicking "Run workflow" in GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26 # Stable LTS

      - name: Install dependencies
        run: npm install

      - name: Build Joplin plugin (.jpl)
        run: npm run dist

      # Creates a GitHub Release with your .jpl file attached (No npm needed!)
      - name: Upload .jpl to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: publish/*.jpl
          generate_release_notes: true
          prerelease: true # Marked as testing/pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
