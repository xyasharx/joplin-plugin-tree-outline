name: Release Joplin Plugin

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.0, v1.0.1
  workflow_dispatch: # Allows you to manually trigger the release from the GitHub UI

permissions:
  contents: write # Required to create GitHub releases and upload the .jpl file

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build Joplin plugin (.jpl)
        run: npm run dist

      - name: Verify build outputs
        run: |
          ls -la publish/
          if [ ! -f publish/*.jpl ]; then
            echo "Error: .jpl file was not generated in publish/ directory!"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*.jpl
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (Triggers Joplin's Official Crawler)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
