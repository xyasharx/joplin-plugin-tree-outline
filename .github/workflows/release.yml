name: Release Joplin Plugin

on:
  push:
    tags:
      - 'v*' # Triggers on v1.0.0, v1.0.1, etc.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (Latest Supported)
        uses: actions/setup-node@v7
        with:
          node-version: 26 # Or use 'lts/*' for automatic latest LTS
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build Joplin plugin (.jpl)
        run: npm run dist

      - name: Verify build outputs
        run: |
          ls -la publish/
          if [ ! -f publish/*.jpl ]; then
            echo "Error: .jpl file was not generated in publish/ directory!"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: publish/*.jpl
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (Triggers Joplin Crawler)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
